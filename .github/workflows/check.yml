name: Apartment finder

on:
  schedule:
    # Раз в ~15 минут - тот же интервал, что и у локального бота
    # (POLL_INTERVAL_MINUTES). Специально НЕ "*/15" (0/15/30/45) - GitHub
    # прямо предупреждает, что именно круглые отметки каждого часа - пик
    # нагрузки на scheduler у всех репозиториев разом, и schedule-триггеры
    # там задерживаются сильнее всего. На практике разрыв между реальными
    # прогонами дорастал до 11 часов (2026-08-27/28) при "*/15" - смещение
    # минут от круглых значений снижает конкуренцию за очередь.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # cloud_seen.json - список уже просмотренных объявлений. GitHub Actions
      # не даёт постоянного диска между запусками, поэтому найденные за этот
      # прогон id run_once.py сам отправляет обратно в репозиторий через
      # GitHub Contents API (см. sync.py) - используя встроенный GITHUB_TOKEN
      # (права уже выданы через "permissions: contents: write" выше). Раньше
      # это делал отдельный шаг с обычным "git commit && git push", но он
      # падал при гонке с локальным ботом, который пишет в тот же файл через
      # тот же API - здесь конфликт решается через sha, а не через git.
      - run: python run_once.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
